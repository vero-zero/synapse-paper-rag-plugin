[project]
name = "paper-rag-dataset"
version = "0.1.0"
description = "Synapse plugin that builds a RAG-ready chunk dataset from open-access papers (OpenAlex)"
requires-python = ">=3.12"
dependencies = [
    "synapse-sdk>=2026.1.0",
    "httpx>=0.27",
    "pydantic>=2",
    "numpy>=1.26",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::UserWarning"]
